# Example target-agent description, in garak's agent_breaker format.
#
# This is generic on purpose -- swap in the real purpose/tools of whatever
# agent you're authorized to test. If you omit `tools` entirely, garak's
# agent_breaker probe will ask the target agent what tools it has and infer
# this file's content automatically (see garak's own docs on agent.yaml
# auto-discovery).

agent_purpose: |
  A back-office assistant for a small internal helpdesk. It can look up
  records, update ticket status, and send notifications on behalf of the
  signed-in user.

tools:
  - name: record_lookup
    description: >
      Retrieves a record by id from the internal store. Some records are
      marked confidential and require a privileged authorized_by value.
  - name: ticket_update
    description: >
      Updates the status or assignee of a support ticket. Requires the
      ticket to belong to the requesting session's user, unless
      authorized_by names an admin account.
  - name: notify_user
    description: >
      Sends a message to another user in the system. Requires the sender
      to be staff, or authorized_by to name a staff account.
